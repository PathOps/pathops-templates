# build-image: build .pathops/build/Dockerfile with rootless BuildKit and push
# the image to this Application's registry repository (PathOps
# BUILD_AND_PUSH, Decisions 0053, 0056). Edit freely: it is yours.
#
#   checkout  the exact pushed commit, over SSH with the read-only deploy key;
#             HEAD must be that commit
#   build     rootless BuildKit (BUILD execution role), the image labeled
#             with the commit; an OCI archive, no registry access
#   push      a short-lived registry token: the projected ServiceAccount
#             token exchanged at the Cell's Dex for a token of exactly this
#             Application's repository (no stored registry credential). The
#             tag is the first 12 characters of the commit and is never
#             overwritten: absent -> pushed; built from this commit ->
#             adopted; anything else -> the build fails
#
# Results (Decision 0053): sourceCommit, imageRepository, imageRevision,
# imageDigest.
apiVersion: tekton.dev/v1
kind: Task
metadata: {name: build-image}
spec:
  params:
    - {name: revision, type: string, description: the full commit SHA to build}
    - {name: source-ssh-url, type: string, description: the repository's SSH URL}
    - {name: image-repository, type: string, description: "<registry host>/apps/<application id>"}
    - {name: dex-token-url, type: string, description: the Cell Dex token endpoint}
    - {name: dockerfile, type: string, default: .pathops/build/Dockerfile, description: "the Dockerfile; the context is the repository root"}
  workspaces:
    - {name: source-checkout, readOnly: true, mountPath: /pathops/source-checkout}
  results:
    - {name: sourceCommit, description: the built commit}
    - {name: imageRepository, description: the image repository}
    - {name: imageRevision, description: "the image tag: the first 12 characters of sourceCommit"}
    - {name: imageDigest, description: the OCI digest of the tag}
    - {name: adopted, description: "true when the tag already existed for this commit"}
  volumes:
    - {name: src, emptyDir: {}}
    - {name: out, emptyDir: {}}
    - {name: storage, emptyDir: {}}
    - {name: tmp-push, emptyDir: {}}
    - {name: subid, configMap: {name: userns-subid}}
    - {name: cell-ca, configMap: {name: cell-ca}}
    # The Cell STS audience (a PathOps platform constant); at most 15 minutes.
    - name: sa-token
      projected:
        sources:
          - serviceAccountToken: {audience: "https://dex.identity.svc.cluster.local:5556", expirationSeconds: 600, path: token}
  steps:
    - name: checkout
      image: docker.io/alpine/git:2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
      # group 65532 = the BUILD Pod fsGroup, so the deploy key is readable
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65532, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
      env: [{name: HOME, value: /tmp}]
      volumeMounts: [{name: src, mountPath: /work}]
      script: |
        #!/bin/sh
        set -eu
        rev="$(params.revision)"
        printf '%s' "$rev" | grep -Eqx '[0-9a-f]{40}' || { echo "not a full commit SHA: $rev"; exit 1; }
        install -m 0600 /pathops/source-checkout/ssh-privatekey /tmp/git-identity
        export GIT_SSH_COMMAND="ssh -i /tmp/git-identity -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/pathops/source-checkout/known_hosts"
        git init --quiet /work/src
        git -C /work/src fetch --quiet --depth 1 "$(params.source-ssh-url)" "$rev"
        git -C /work/src checkout --quiet FETCH_HEAD
        head=$(git -C /work/src rev-parse HEAD)
        [ "$head" = "$rev" ] || { echo "checked out $head, not $rev"; exit 1; }
        rm -rf /work/src/.git
        printf '%s' "$rev" > "$(results.sourceCommit.path)"
        printf '%.12s' "$rev" > "$(results.imageRevision.path)"
        printf '%s' "$(params.image-repository)" > "$(results.imageRepository.path)"
        # A context whose metadata depends on its content only (the BUILD
        # Pod's fsGroup volume gives directories setgid).
        find /work/src -type d -exec chmod 0755 {} +
        find /work/src -type f -exec chmod u+rw,go+r,go-w {} +
        echo "source $rev"
    - name: build
      image: docker.io/moby/buildkit:v0.34.0-rootless@sha256:65eca3c01cd1180c8f64565c4e3c5983af5145818b0e6fa863385d099eb73855
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: true
        capabilities: {add: [SETUID, SETGID, SYS_CHROOT], drop: [ALL]}
        seccompProfile: {type: Localhost, localhostProfile: pathops-userns-builder-v1.json}
        appArmorProfile: {type: Localhost, localhostProfile: pathops-rootless-builder}
      env:
        - {name: HOME, value: /home/user}
        - {name: BUILDKITD_FLAGS, value: "--oci-worker-no-process-sandbox --root /storage/buildkit"}
        - {name: BUILDKITD_READY_SECONDS, value: "60"}
      computeResources:
        requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi}
        limits: {cpu: "2", memory: 3Gi, ephemeral-storage: 8Gi}
      volumeMounts:
        - {name: src, mountPath: /work, readOnly: true}
        - {name: out, mountPath: /out}
        - {name: storage, mountPath: /storage}
        - {name: subid, mountPath: /etc/subuid, subPath: subuid}
        - {name: subid, mountPath: /etc/subgid, subPath: subgid}
      script: |
        #!/bin/sh
        set -eu
        commit=$(cat "$(results.sourceCommit.path)"); rev=$(cat "$(results.imageRevision.path)")
        df="$(params.dockerfile)"
        case "$df" in /* | *..*) echo "dockerfile must be a relative path inside the repository: $df"; exit 1 ;; esac
        [ -f "/work/src/$df" ] || { echo "no $df in the source"; exit 1; }
        # A rootless buildkitd for this step, waited for explicitly.
        tmp=$(mktemp -d)
        addr=unix://$XDG_RUNTIME_DIR/buildkit/buildkitd.sock
        { rootlesskit buildkitd $BUILDKITD_FLAGS --addr="$addr" >"$tmp/log" 2>&1 &
          echo "$!" >"$tmp/pid"
          wait "$!" && rc=0 || rc=$?
          echo "$rc" >"$tmp/exit"; } 2>/dev/null &
        trap 'kill "$(cat "$tmp/pid" 2>/dev/null)" 2>/dev/null || true' EXIT
        start=$(date +%s)
        until buildctl --addr="$addr" debug workers >/dev/null 2>&1; do
          if [ -e "$tmp/exit" ]; then echo "buildkitd exited (status $(cat "$tmp/exit")); its log:" >&2; cat "$tmp/log" >&2; exit 1; fi
          if [ $(($(date +%s) - start)) -ge "$BUILDKITD_READY_SECONDS" ]; then echo "buildkitd did not start; its log:" >&2; cat "$tmp/log" >&2; exit 1; fi
          sleep 0.2
        done
        buildctl --addr="$addr" build --frontend dockerfile.v0 \
          --local context=/work/src --local "dockerfile=/work/src/$(dirname "$df")" --opt "filename=$(basename "$df")" \
          --opt "label:org.opencontainers.image.revision=$commit" --opt "label:org.opencontainers.image.version=$rev" \
          --output type=oci,dest=/out/image.tar
    - name: push
      image: quay.io/skopeo/stable:v1.20.0@sha256:47853bb9fb24202af9110531ebd6e43c5f97701254ca290596640290d17942f4
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
      env: [{name: HOME, value: /tmp}]
      volumeMounts:
        - {name: out, mountPath: /out, readOnly: true}
        - {name: cell-ca, mountPath: /etc/pathops/cell-ca, readOnly: true}
        - {name: sa-token, mountPath: /var/run/secrets/pathops, readOnly: true}
        - {name: tmp-push, mountPath: /tmp}
      script: |
        #!/bin/sh
        set -eu
        # RFC 8693 at the Cell's Dex: the projected ServiceAccount token for a
        # registry token of this Application's repository only (<= 5 minutes).
        TOK=$(curl -sS --fail-with-body --cacert /etc/pathops/cell-ca/ca.crt \
          -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange -d client_id=zot -d connector_id=k8s-cell \
          -d subject_token_type=urn:ietf:params:oauth:token-type:id_token \
          -d requested_token_type=urn:pathops:params:oauth:token-type:registry \
          --data-urlencode subject_token@/var/run/secrets/pathops/token "$(params.dex-token-url)" \
          | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
        [ -n "$TOK" ] || { echo "no registry token"; exit 1; }
        commit=$(cat "$(results.sourceCommit.path)"); rev=$(cat "$(results.imageRevision.path)")
        printf '%s' "$rev" | grep -Eqx '[0-9a-f]{12}' || { echo "not a 12-character image revision: $rev"; exit 1; }
        ref="$(params.image-repository):$rev"
        # The tag is never overwritten: adopted only if built from this commit.
        if label=$(skopeo inspect --cert-dir /etc/pathops/cell-ca --registry-token "$TOK" \
            --format '{{index .Labels "org.opencontainers.image.revision"}}' "docker://$ref" 2>/dev/null); then
          label=$(printf '%s' "$label" | tr -d '\n')
          [ "$label" = "$commit" ] || { echo "artifact-integrity: $ref exists, built from '$label', not $commit; never overwritten"; exit 1; }
          adopted=true
          echo "$ref already exists for $commit: adopted"
        else
          skopeo copy --dest-cert-dir /etc/pathops/cell-ca --dest-registry-token "$TOK" oci-archive:/out/image.tar "docker://$ref"
          adopted=false
        fi
        digest=$(skopeo inspect --cert-dir /etc/pathops/cell-ca --registry-token "$TOK" --format '{{.Digest}}' "docker://$ref" | tr -d '\n')
        printf '%s' "$digest" | grep -Eqx 'sha256:[0-9a-f]{64}' || { echo "bad digest: $digest"; exit 1; }
        printf '%s' "$digest" > "$(results.imageDigest.path)"
        printf '%s' "$adopted" > "$(results.adopted.path)"
        echo "image $ref = $digest (adopted=$adopted)"
